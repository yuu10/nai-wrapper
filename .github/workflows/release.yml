name: Release
# リリース用。`v*` タグの push で、3 OS の全形式をビルドし、GitHub の Releases に「下書き・pre-release」で載せる。
# 公開(下書きの解除)は人が行う。タグと package.json の version が違えば、ビルドの前に失敗させる。
# タグは、ユーザーが GitHub の Releases から作る(例: v0.1.0)。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: タグと package.json の version が同じか確かめる
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::タグ($TAG)と package.json の version($VERSION)が違います。version を直すか、タグを付け直してください。"
            exit 1
          fi
      - run: node --check main.js

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: '--win' }
          - { name: macos, os: macos-latest, args: '--mac' }
          - { name: linux, os: ubuntu-latest, args: '--linux' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nai-wrapper-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  release:
    # 3 OS がすべて成功したときだけ、下書きを作る(1 つでも失敗したら作らない)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 下書きの Release を作る(pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l artifacts
          cat > notes.md <<'EOF'
          ## NAI Wrapper(非公式・ベータ版)

          NovelAI を専用ウィンドウで開く、**非公式**のデスクトップアプリです。NovelAI(Anlatan Inc.)とは関係がありません。NovelAI の利用規約に従い、自己責任でお使いください。

          ### 注意
          - **コード署名をしていません。** 初回の起動で警告が出ます。回避方法は、README の「署名なしの警告」を見てください。
            - Windows: SmartScreen の画面で「詳細情報 → 実行」。
            - macOS: アプリを右クリックして「開く」。
          - **動作確認の状況**
            - Windows: 開発環境(`npm start`)で確認済み。この配布物(インストーラ・ポータブル版)での動作は、未確認です。
            - macOS・Linux: **試験版・動作未確認**です。macOS の配布物は、Apple Silicon(arm64)向けです。
          - 辞書・日本語訳・拡張機能は、付属していません(README を見てください)。
          - NovelAI の画面の作りが変わると、自動生成などが動かなくなることがあります。

          ### ファイル
          - Windows: `.exe`(インストーラ版・ポータブル版)
          - macOS: `.dmg` / `.zip`
          - Linux: `.AppImage` / `.deb`

          ライセンスは MIT です(アプリ内の「ヘルプ → ライセンスと権利表記を開く」にも載せています)。
          EOF
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "NAI Wrapper ${TAG}(ベータ版)" \
            --notes-file notes.md
